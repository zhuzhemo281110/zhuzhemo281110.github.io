<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>💕 彭馨妤 & 朱哲墨 的小窝</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局高级风格 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body {
            background: linear-gradient(145deg, #fdf0f5 0%, #fce4ec 50%, #f8d8e0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 248, 250, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 28px 22px 30px;
            box-shadow: 0 30px 60px rgba(180, 80, 120, 0.15), 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .header { text-align: center; padding-bottom: 18px; border-bottom: 2px dashed rgba(242, 139, 156, 0.3); }
        .header h1 { font-size: 26px; font-weight: 700; color: #6b3f4e; letter-spacing: 2px; }
        .header h1 i { color: #f28b9c; margin: 0 6px; }
        .header .sub { font-size: 13px; color: #b58394; margin-top: 4px; letter-spacing: 4px; }

        .timer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
        .timer-card {
            background: linear-gradient(135deg, #ffe3ec, #ffd6e3);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: inset 0 2px 8px rgba(255,255,255,0.6), 0 4px 12px rgba(200,100,130,0.08);
        }
        .timer-card .num { font-size: 32px; font-weight: 800; color: #6b2f42; }
        .timer-card .label { font-size: 11px; color: #936b7a; letter-spacing: 1px; }

        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 220, 230, 0.25);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .card h3 { font-size: 16px; font-weight: 600; color: #6b3f4e; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .card h3 i { color: #f28b9c; }

        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .photo-grid .photo {
            aspect-ratio: 1/1;
            background: rgba(252, 228, 236, 0.6);
            border-radius: 16px;
            border: 2px dashed rgba(248, 205, 217, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #d6a8b8;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transition: 0.2s;
            overflow: hidden;
        }
        .photo-grid .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
        .photo-grid .photo:hover { transform: scale(0.97); }

        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        .row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(248, 205, 217, 0.5);
            border-radius: 30px;
            outline: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.7);
            transition: 0.2s;
        }
        .row input:focus { border-color: #f28b9c; box-shadow: 0 0 0 3px rgba(242, 139, 156, 0.1); }
        .row button {
            padding: 12px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .row button:active { transform: scale(0.95); }
        .btn-pink { background: #f28b9c; }
        .btn-pink:hover { background: #e57385; }
        .btn-purple { background: #b8a0c4; }
        .btn-purple:hover { background: #a088b0; }
        .btn-peach { background: #f5b8a0; }
        .btn-peach:hover { background: #e8a088; }

        .list { list-style: none; max-height: 160px; overflow-y: auto; padding-right: 4px; }
        .list li {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #f28b9c;
            color: #4a2e3a;
        }
        .list li .del { color: #d68a9c; cursor: pointer; background: none; border: none; font-size: 16px; }
        .wish-list li .done { text-decoration: line-through; color: #b07f93; opacity: 0.6; }
        .wish-list li .act { display: flex; gap: 8px; }
        .wish-list li .act button { background: none; border: none; cursor: pointer; font-size: 16px; }
        .wish-list li .act .ok { color: #7fb07f; }
        .wish-list li .act .del { color: #d68a9c; }

        .heart-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f28b9c, #e57385);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 12px 0;
            box-shadow: 0 6px 20px rgba(230, 100, 130, 0.2);
            transition: 0.2s;
        }
        .heart-btn:active { transform: scale(0.96); }

        .music {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 8px 18px;
            border: 1px solid rgba(255, 220, 230, 0.3);
            margin-top: 8px;
            backdrop-filter: blur(4px);
        }
        .music i { font-size: 22px; color: #7c3f58; cursor: pointer; transition: 0.2s; }
        .music i:hover { color: #f28b9c; }
        .music .name { flex: 1; font-size: 13px; color: #5a3a4a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music .progress {
            flex: 1;
            height: 4px;
            background: rgba(200, 100, 130, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            max-width: 80px;
        }
        .music .progress .bar {
            height: 100%;
            width: 0%;
            background: #f28b9c;
            border-radius: 4px;
            transition: width 0.1s;
        }

        .rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
        .rain span { position: absolute; top: -30px; font-size: 26px; animation: fall linear forwards; opacity: 0.8; }
        @keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #fce4ec; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #f8cdd9; border-radius: 8px; }

        .tip {
            font-size: 11px;
            color: #b58394;
            text-align: center;
            margin-top: 6px;
            letter-spacing: 1px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1><span>彭馨妤</span> <i class="fas fa-heart"></i> <span>朱哲墨</span></h1>
        <div class="sub">✨ 我们的专属世界 ✨</div>
    </div>

    <div class="timer-grid">
        <div class="timer-card"><div class="num" id="days">0</div><div class="label">❤️ 在一起天数</div></div>
        <div class="timer-card"><div class="num" id="countdown">0</div><div class="label">📅 距离纪念日</div></div>
    </div>

    <!-- ===== 【❗重点：照片墙 - 把下面每张图片的链接换成你自己的】 ===== -->
    <div class="card">
        <h3><i class="fas fa-images"></i> 照片墙 · 我们的时光</h3>
        <div class="photo-grid" id="photoGrid">
            <!-- ↓↓↓ 第1张：把 https://你的图片链接1.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接1.jpg'); background-size: cover; background-position: center; border: none;"></div>
            <!-- ↓↓↓ 第2张：把 https://你的图片链接2.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接2.jpg'); background-size: cover; background-position: center; border: none;"></div>
            <!-- ↓↓↓ 第3张：把 https://你的图片链接3.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接3.jpg'); background-size: cover; background-position: center; border: none;"></div>
            <!-- ↓↓↓ 第4张：把 https://你的图片链接4.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接4.jpg'); background-size: cover; background-position: center; border: none;"></div>
            <!-- ↓↓↓ 第5张：把 https://你的图片链接5.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接5.jpg'); background-size: cover; background-position: center; border: none;"></div>
            <!-- ↓↓↓ 第6张：把 https://你的图片链接6.jpg 换成你的图片地址 ↓↓↓ -->
            <div class="photo" style="background-image: url('https://你的图片链接6.jpg'); background-size: cover; background-position: center; border: none;"></div>
        </div>
        <p class="tip">💡 点 + 号可上传新照片（仅本地预览）</p>
    </div>

    <!-- ===== 日常记录 ===== -->
    <div class="card">
        <h3><i class="fas fa-pen-fancy"></i> 今日小记</h3>
        <div class="row">
            <input id="diaryInput" placeholder="今天发生了什么美好的事？">
            <button class="btn-pink" onclick="addDiary()">记录</button>
        </div>
        <ul class="list" id="diaryList"></ul>
    </div>

    <!-- ===== 留言板 ===== -->
    <div class="card">
        <h3><i class="fas fa-comment-dots"></i> 专属留言板</h3>
        <div class="row">
            <input id="msgInput" placeholder="想对TA说的悄悄话...">
            <button class="btn-purple" onclick="addMsg()">发送</button>
        </div>
        <ul class="list" id="msgList"></ul>
    </div>

    <!-- ===== 心愿清单 ===== -->
    <div class="card">
        <h3><i class="fas fa-star"></i> 我们的心愿清单</h3>
        <div class="row">
            <input id="wishInput" placeholder="比如：一起去看极光...">
            <button class="btn-peach" onclick="addWish()">加入</button>
        </div>
        <ul class="list wish-list" id="wishList"></ul>
    </div>

    <!-- ===== 爱心雨 ===== -->
    <button class="heart-btn" onclick="rain()">💖 下爱心雨</button>

    <!-- ===== 【❗重点：音乐播放器 - 把歌曲链接换成你自己的】 ===== -->
    <div class="music">
        <i class="fas fa-play" id="playBtn" onclick="toggleMusic()"></i>
        <span class="name" id="musicName">🎵 专属BGM</span>
        <div class="progress" onclick="seekMusic(event)"><div class="bar" id="progressBar"></div></div>
        <i class="fas fa-exchange-alt" onclick="nextMusic()" style="font-size:16px;color:#b07f93;cursor:pointer;"></i>
    </div>
</div>

<div class="rain" id="rainBox"></div>

<script>
    // ============================================================
    // 【❗重点】音乐列表 - 把下面的歌曲链接换成你自己的
    // 格式：{ name: '歌曲名', url: '歌曲MP3地址' }
    // ============================================================
    const songs = [
        { name: '🌟 小情歌', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { name: '🌙 爱的旋律', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
        { name: '☀️ 晴天', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
    ];

    // ============================================================
    // 【❗重点】计时器 - 把下面的日期改成你们在一起的日期
    // 格式：'YYYY-MM-DD'
    // ============================================================
    const START_DATE = '2026-07-28';

    // ============================================================
    // 以下代码不需要修改，直接复制即可
    // ============================================================
    function updateDays() {
        const start = new Date(START_DATE);
        const now = new Date();
        const diff = Math.floor((now - start) / (1000*60*60*24));
        document.getElementById('days').textContent = diff >= 0 ? diff : 0;
        const target = new Date('2026-10-01');
        const remain = Math.ceil((target - now) / (1000*60*60*24));
        document.getElementById('countdown').textContent = remain > 0 ? remain : '🎉';
    }
    updateDays();
    setInterval(updateDays, 60000);

    function addPhoto(el) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                el.innerHTML = '<img src="'+ev.target.result+'">';
                el.style.border = 'none';
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    const DK = 'diary_v2';
    function getDiary() { return JSON.parse(localStorage.getItem(DK)||'[]'); }
    function saveDiary(d) { localStorage.setItem(DK, JSON.stringify(d)); }
    function renderDiary() {
        const list = getDiary();
        const ul = document.getElementById('diaryList');
        ul.innerHTML = list.map((t,i) => `<li><span>${t}</span><button class="del" onclick="delDiary(${i})">✕</button></li>`).join('');
    }
    function addDiary() {
        const input = document.getElementById('diaryInput');
        const v = input.value.trim();
        if (!v) return alert('写点内容吧~');
        const list = getDiary();
        list.unshift(v);
        saveDiary(list);
        renderDiary();
        input.value = '';
    }
    function delDiary(i) { const list = getDiary(); list.splice(i,1); saveDiary(list); renderDiary(); }
    renderDiary();

    const MK = 'msg_v2';
    function getMsg() { return JSON.parse(localStorage.getItem(MK)||'[]'); }
    function saveMsg(d) { localStorage.setItem(MK, JSON.stringify(d)); }
    function renderMsg() {
        const list = getMsg();
        const ul = document.getElementById('msgList');
        ul.innerHTML = list.map((t,i) => `<li><span>${t.time} ${t.text}</span><button class="del" onclick="delMsg(${i})">✕</button></li>`).join('');
    }
    function addMsg() {
        const input = document.getElementById('msgInput');
        const v = input.value.trim();
        if (!v) return alert('说句话吧~');
        const list = getMsg();
        const now = new Date();
        const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
        list.unshift({text:v,time:t});
        saveMsg(list);
        renderMsg();
        input.value = '';
    }
    function delMsg(i) { const list = getMsg(); list.splice(i,1); saveMsg(list); renderMsg(); }
    renderMsg();

    const WK = 'wish_v2';
    function getWish() { return JSON.parse(localStorage.getItem(WK)||'[]'); }
    function saveWish(d) { localStorage.setItem(WK, JSON.stringify(d)); }
    function renderWish() {
        const list = getWish();
        const ul = document.getElementById('wishList');
        ul.innerHTML = list.map((t,i) => {
            const c = t.done ? 'done' : '';
            const ok = t.done ? '' : `<button class="ok" onclick="doneWish(${i})">✓</button>`;
            return `<li><span class="${c}">${t.text}</span><div class="act">${ok}<button class="del" onclick="delWish(${i})">✕</button></div></li>`;
        }).join('');
    }
    function addWish() {
        const input = document.getElementById('wishInput');
        const v = input.value.trim();
        if (!v) return alert('写个心愿吧~');
        const list = getWish();
        list.push({text:v,done:false});
        saveWish(list);
        renderWish();
        input.value = '';
    }
    function doneWish(i) { const list = getWish(); list[i].done = !list[i].done; saveWish(list); renderWish(); }
    function delWish(i) { const list = getWish(); list.splice(i,1); saveWish(list); renderWish(); }
    renderWish();

    function rain() {
        const box = document.getElementById('rainBox');
        const emojis = ['❤️','💖','💗','♥️','💕','💘'];
        for (let i=0; i<30; i++) {
            setTimeout(() => {
                const span = document.createElement('span');
                span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                span.style.left = Math.random()*100+'%';
                span.style.fontSize = (18+Math.random()*20)+'px';
                span.style.animationDuration = (2+Math.random()*3)+'s';
                box.appendChild(span);
                setTimeout(() => span.remove(), 5000);
            }, i*100);
        }
    }

    let idx = 0, playing = false;
    const audio = new Audio();
    const playBtn = document.getElementById('playBtn');
    const nameEl = document.getElementById('musicName');
    const progressBar = document.getElementById('progressBar');

    function loadSong(i) {
        audio.src = songs[i].url;
        nameEl.textContent = '🎵 '+songs[i].name;
    }
    function toggleMusic() {
        if (playing) { audio.pause(); playBtn.className = 'fas fa-play'; playing = false; }
        else { audio.play().catch(()=>{}); playBtn.className = 'fas fa-pause'; playing = true; }
    }
    function nextMusic() {
        idx = (idx+1)%songs.length;
        loadSong(idx);
        if (playing) { audio.play().catch(()=>{}); playBtn.className = 'fas fa-pause'; }
        else { playBtn.className = 'fas fa-play'; }
    }
    function seekMusic(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    }
    loadSong(0);
    audio.ontimeupdate = function() {
        if (audio.duration) {
            progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
    };
    audio.onended = function() { nextMusic(); if (playing) audio.play().catch(()=>{}); };
</script>
</body>
</html>
