<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 彭馨妤 & 朱哲墨 的小窝</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: #fff5f7; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .box { max-width: 420px; width: 100%; background: rgba(255,255,255,0.85); border-radius: 32px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(200,100,130,0.12); }
        .name { text-align: center; font-size: 24px; font-weight: 700; color: #7c3f58; padding: 10px 0 16px; }
        .name i { color: #f28b9c; margin: 0 6px; }
        .timer { background: linear-gradient(135deg, #ffe3ec, #ffd6e3); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .timer .num { font-size: 42px; font-weight: 800; color: #7c2f4a; }
        .timer .label { color: #8a5a6e; font-size: 14px; }
        .card { background: #fff9fa; border-radius: 18px; padding: 16px; margin-bottom: 16px; border: 1px solid #fce4ec; }
        .card h3 { color: #7c3f58; font-size: 16px; margin-bottom: 10px; }
        .card h3 i { color: #f28b9c; margin-right: 6px; }
        .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
        .photo-grid div { aspect-ratio:1; background:#fce4ec; border-radius:12px; border:2px dashed #f8cdd9; display:flex; align-items:center; justify-content:center; font-size:24px; color:#d6a8b8; cursor:pointer; background-size:cover; background-position:center; }
        .photo-grid div img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
        .row { display:flex; gap:8px; margin-bottom:10px; }
        .row input { flex:1; padding:10px 14px; border:1px solid #f8cdd9; border-radius:30px; outline:none; font-size:14px; background:#fff; }
        .row input:focus { border-color:#f28b9c; }
        .row button { padding:10px 20px; border:none; border-radius:30px; color:#fff; font-weight:600; cursor:pointer; font-size:14px; }
        .btn-pink { background:#f28b9c; }
        .btn-pink:hover { background:#e57385; }
        .btn-purple { background:#b8a0c4; }
        .btn-purple:hover { background:#a088b0; }
        .btn-peach { background:#f5b8a0; }
        .btn-peach:hover { background:#e8a088; }
        .list { list-style:none; max-height:160px; overflow-y:auto; }
        .list li { background:#fff; padding:10px 14px; border-radius:14px; margin-bottom:6px; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #f28b9c; color:#4a2e3a; }
        .list li .del { color:#d68a9c; cursor:pointer; background:none; border:none; font-size:16px; }
        .wish-list li .done { text-decoration:line-through; color:#b07f93; opacity:0.6; }
        .wish-list li .act { display:flex; gap:8px; }
        .wish-list li .act button { background:none; border:none; cursor:pointer; font-size:16px; }
        .wish-list li .act .ok { color:#7fb07f; }
        .wish-list li .act .del { color:#d68a9c; }
        .heart-btn { display:block; width:100%; padding:14px; background:linear-gradient(135deg,#f28b9c,#e57385); border:none; border-radius:50px; color:#fff; font-size:18px; font-weight:600; cursor:pointer; margin:10px 0; box-shadow:0 6px 18px rgba(230,100,130,0.25); }
        .heart-btn:hover { transform:scale(0.98); }
        .music { display:flex; align-items:center; gap:12px; background:#fff9fa; border-radius:40px; padding:8px 16px; border:1px solid #fce4ec; margin-top:10px; }
        .music i { font-size:20px; color:#7c3f58; cursor:pointer; }
        .music .name { flex:1; font-size:14px; color:#5a3a4a; }
        .rain { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; overflow:hidden; }
        .rain span { position:absolute; top:-30px; font-size:24px; animation:fall linear forwards; opacity:0.8; }
        @keyframes fall { 0% { transform:translateY(0) rotate(0deg); opacity:1; } 100% { transform:translateY(110vh) rotate(720deg); opacity:0; } }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:#fce4ec; border-radius:8px; }
        ::-webkit-scrollbar-thumb { background:#f8cdd9; border-radius:8px; }
    </style>
</head>
<body>

<div class="box">
    <div class="name">
        <span>彭馨妤</span> <i class="fas fa-heart"></i> <span>朱哲墨</span>
    </div>

    <div class="timer">
        <div class="label">💞 我们在一起</div>
        <div class="num"><span id="days">0</span> 天</div>
        <div style="font-size:13px;color:#b07f93;">始于 2026-07-28</div>
    </div>

    <div class="card">
        <h3><i class="fas fa-images"></i> 照片墙</h3>
        <div class="photo-grid" id="photoGrid">
            <div onclick="addPhoto(this)">+</div>
            <div onclick="addPhoto(this)">+</div>
            <div onclick="addPhoto(this)">+</div>
            <div onclick="addPhoto(this)">+</div>
            <div onclick="addPhoto(this)">+</div>
            <div onclick="addPhoto(this)">+</div>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-pen-fancy"></i> 日常小记</h3>
        <div class="row">
            <input id="diaryInput" placeholder="今天发生了什么？">
            <button class="btn-pink" onclick="addDiary()">记录</button>
        </div>
        <ul class="list" id="diaryList"></ul>
    </div>

    <div class="card">
        <h3><i class="fas fa-comment-dots"></i> 悄悄话</h3>
        <div class="row">
            <input id="msgInput" placeholder="想对TA说...">
            <button class="btn-purple" onclick="addMsg()">发送</button>
        </div>
        <ul class="list" id="msgList"></ul>
    </div>

    <div class="card">
        <h3><i class="fas fa-star"></i> 心愿清单</h3>
        <div class="row">
            <input id="wishInput" placeholder="想去的地方...">
            <button class="btn-peach" onclick="addWish()">加入</button>
        </div>
        <ul class="list wish-list" id="wishList"></ul>
    </div>

    <button class="heart-btn" onclick="rain()">❤️ 下爱心雨</button>

    <div class="music">
        <i class="fas fa-play" id="playBtn" onclick="toggleMusic()"></i>
        <span class="name" id="musicName">🎵 专属BGM</span>
        <i class="fas fa-exchange-alt" onclick="nextMusic()" style="font-size:14px;color:#b07f93;"></i>
    </div>
</div>

<div class="rain" id="rainBox"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script>
// ===== 计时器 =====
function updateDays() {
    const start = new Date('2026-07-28');
    const now = new Date();
    const diff = Math.floor((now - start) / (1000*60*60*24));
    document.getElementById('days').textContent = diff >= 0 ? diff : 0;
}
updateDays();

// ===== 照片墙 =====
function addPhoto(el) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            el.innerHTML = '<img src="'+ev.target.result+'">';
            el.style.border = 'none';
        };
        reader.readAsDataURL(file);
    };
    input.click();
}

// ===== 日常记录 =====
const DK = 'diary';
function getDiary() { return JSON.parse(localStorage.getItem(DK)||'[]'); }
function saveDiary(d) { localStorage.setItem(DK, JSON.stringify(d)); }
function renderDiary() {
    const list = getDiary();
    const ul = document.getElementById('diaryList');
    ul.innerHTML = list.map((t,i) => '<li><span>'+t+'</span><button class="del" onclick="delDiary('+i+')">✕</button></li>').join('');
}
function addDiary() {
    const input = document.getElementById('diaryInput');
    const v = input.value.trim();
    if (!v) return alert('写点内容吧~');
    const list = getDiary();
    list.unshift(v);
    saveDiary(list);
    renderDiary();
    input.value = '';
}
function delDiary(i) { const list = getDiary(); list.splice(i,1); saveDiary(list); renderDiary(); }
renderDiary();

// ===== 留言板 =====
const MK = 'msg';
function getMsg() { return JSON.parse(localStorage.getItem(MK)||'[]'); }
function saveMsg(d) { localStorage.setItem(MK, JSON.stringify(d)); }
function renderMsg() {
    const list = getMsg();
    const ul = document.getElementById('msgList');
    ul.innerHTML = list.map((t,i) => '<li><span>'+t.time+' '+t.text+'</span><button class="del" onclick="delMsg('+i+')">✕</button></li>').join('');
}
function addMsg() {
    const input = document.getElementById('msgInput');
    const v = input.value.trim();
    if (!v) return alert('说句话吧~');
    const list = getMsg();
    const now = new Date();
    const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    list.unshift({text:v,time:t});
    saveMsg(list);
    renderMsg();
    input.value = '';
}
function delMsg(i) { const list = getMsg(); list.splice(i,1); saveMsg(list); renderMsg(); }
renderMsg();

// ===== 心愿清单 =====
const WK = 'wish';
function getWish() { return JSON.parse(localStorage.getItem(WK)||'[]'); }
function saveWish(d) { localStorage.setItem(WK, JSON.stringify(d)); }
function renderWish() {
    const list = getWish();
    const ul = document.getElementById('wishList');
    ul.innerHTML = list.map((t,i) => {
        const c = t.done ? 'done' : '';
        const ok = t.done ? '' : '<button class="ok" onclick="doneWish('+i+')">✓</button>';
        return '<li><span class="'+c+'">'+t.text+'</span><div class="act">'+ok+'<button class="del" onclick="delWish('+i+')">✕</button></div></li>';
    }).join('');
}
function addWish() {
    const input = document.getElementById('wishInput');
    const v = input.value.trim();
    if (!v) return alert('写个心愿吧~');
    const list = getWish();
    list.push({text:v,done:false});
    saveWish(list);
    renderWish();
    input.value = '';
}
function doneWish(i) { const list = getWish(); list[i].done = !list[i].done; saveWish(list); renderWish(); }
function delWish(i) { const list = getWish(); list.splice(i,1); saveWish(list); renderWish(); }
renderWish();

// ===== 爱心雨 =====
function rain() {
    const box = document.getElementById('rainBox');
    const emojis = ['❤️','💖','💗','♥️','💕','💘'];
    for (let i=0; i<30; i++) {
        setTimeout(() => {
            const span = document.createElement('span');
            span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
            span.style.left = Math.random()*100+'%';
            span.style.fontSize = (18+Math.random()*20)+'px';
            span.style.animationDuration = (2+Math.random()*3)+'s';
            box.appendChild(span);
            setTimeout(() => span.remove(), 5000);
        }, i*100);
    }
}

// ===== 音乐 =====
const songs = [
    { name:'小情歌', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
    { name:'爱的旋律', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
    { name:'晴天', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
];
let idx = 0, playing = false;
const audio = new Audio();
const playBtn = document.getElementById('playBtn');
const nameEl = document.getElementById('musicName');

function loadSong(i) {
    audio.src = songs[i].url;
    nameEl.textContent = '🎵 '+songs[i].name;
}
function toggleMusic() {
    if (playing) { audio.pause(); playBtn.className = 'fas fa-play'; playing = false; }
    else { audio.play().catch(()=>{}); playBtn.className = 'fas fa-pause'; playing = true; }
}
function nextMusic() {
    idx = (idx+1)%songs.length;
    loadSong(idx);
    if (playing) { audio.play().catch(()=>{}); playBtn.className = 'fas fa-pause'; }
    else { playBtn.className = 'fas fa-play'; }
}
loadSong(0);
audio.onended = function() { nextMusic(); if (playing) audio.play().catch(()=>{}); };
</script>
</body>
</html>
